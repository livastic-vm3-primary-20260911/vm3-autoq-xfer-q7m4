name: VM3 Health Child Binding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-child:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_HEALTH_CHILD_TOKEN }}
      MERGIFY_TEST_JOB_NAME: vm3-health-child-healthid5e2bb2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current upstream pytest-mergify
        run: pip install 'git+https://github.com/Mergifyio/mergify-ci-integrations.git@eb58dda97e10ca3151c2ef6e0106bf5e692606cd#subdirectory=clients/pytest-mergify'
      - name: Run controlled failing test
        run: pytest -q -s "vm3-health-child-healthid5e2bb2/test_victim.py"
