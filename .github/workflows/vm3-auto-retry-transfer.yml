name: VM3 Auto Retry Transfer Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Record attempt
        run: |
          echo "VM3_RETRY_TRANSFER_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "VM3_RETRY_TRANSFER_REPOSITORY=${GITHUB_REPOSITORY}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            echo 'VM3_RETRY_TRANSFER_FIRST_ATTEMPT_FAIL'
            exit 1
          fi
          echo 'VM3_RETRY_TRANSFER_RERUN_SUCCESS'
